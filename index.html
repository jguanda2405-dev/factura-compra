<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Factura de Compra</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white text-center">
                        <h4>Emisión de Factura</h4>
                    </div>
                    <div class="card-body">
                        <form action="factura.php" method="POST">
                            <div class="mb-3">
                                <label for="descripcion" class="form-label">Descripción del artículo:</label>
                                <input type="text" class="form-control" id="descripcion" name="descripcion" required>
                            </div>
                            <div class="mb-3">
                                <label for="cantidad" class="form-label">Cantidad adquirida:</label>
                                <input type="number" min="1" step="1" class="form-control" id="cantidad" name="cantidad" required>
                            </div>
                            <div class="mb-3">
                                <label for="precio" class="form-label">Precio unitario ($):</label>
                                <input type="number" min="0.01" step="0.01" class="form-control" id="precio" name="precio" required>
                            </div>
                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary">Generar Factura</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
